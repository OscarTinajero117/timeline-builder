<!DOCTYPE html>
<html lang="es-419">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Línea del Tiempo</title>
    
    <link
      title="timeline-styles"
      rel="stylesheet"
      href="https://cdn.knightlab.com/libs/timeline3/latest/css/timeline.css"
    />
    <script src="https://cdn.knightlab.com/libs/timeline3/latest/js/timeline.js"></script>
    <script src="./data.js"></script>

    <script type="text/javascript">
      document.addEventListener("DOMContentLoaded", function () {
        if (window.timelineData) {
          window.timeline = new TL.Timeline("timeline-embed", window.timelineData);
        } else {
          console.error("Datos no encontrados, revisar data.js");
        }
      });
    </script>
  </head>
  <body>
    <div id="timeline-embed" style="width: 100%; height: 720px"></div>
  </body>
</html>
